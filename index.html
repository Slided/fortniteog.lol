<style>
/* CSS for the initial black overlay and the fade effect */
#initialOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: black; /* Starts black */
    opacity: 1;
    z-index: 10000; /* Ensure it's on top of everything */
    transition: opacity 2s ease-out; /* The fade-out transition */
    cursor: pointer;
}

#initialOverlay.fade-out {
    opacity: 0;
    /* Optional: Hide after fade to ensure nothing is clickable through it */
    pointer-events: none; 
}

/* Optional: Add a subtle animation to make the 'Click to Continue' visible */
#initialOverlay p {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 20px;
    font-family: sans-serif;
    animation: pulse 1.5s infinite alternate;
}

@keyframes pulse {
    from { opacity: 0.7; }
    to { opacity: 1; }
}
</style>

</style>

<iframe
  id="musicplayer"
  class="musicplayer"
  src="https://www.youtube.com/embed/1ZHjLQFGohs?autoplay=1&mute=1&loop=1&playlist=1ZHjLQFGohs&controls=0&modestbranding=1"
  allow="autoplay"
></iframe>

<audio id="bgm" autoplay loop preload="auto" muted> <source src="lemonglow.mp3" type="audio/mpeg">
</audio>

<script>
const iframe = document.getElementById("musicplayer");
const audio = document.getElementById("bgm");
const initialOverlay = document.getElementById("initialOverlay"); // 🌟 NEW: Get the overlay

// We listen for a click on the initial overlay only, not the whole window.
initialOverlay.addEventListener("click", () => {
    // 1. Initiate the **Fade-In** by applying the class
    initialOverlay.classList.add('fade-out');

    // 2. Start the **Music**
    // Unmute local audio
    audio.muted = false;
    audio.play();

    // Unmute YouTube player
    let src = iframe.src;
    // Check if it's currently muted (it should be with mute=1)
    if (src.includes("mute=1")) {
        // Replace mute=1 with mute=0 to unmute
        src = src.replace("mute=1", "mute=0");
        iframe.src = src; // Reload iframe to apply the new setting
    }

    // 3. Remove the overlay *after* the fade-out is complete (2000ms from the CSS transition)
    setTimeout(() => {
        initialOverlay.remove();
    }, 2000); // Wait 2 seconds (the length of the CSS transition)

}, { once: true });
</script>
