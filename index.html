<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Autoplay Music Fix</title>
<style>
  iframe.musicplayer {
    width: 0;
    height: 0;
    border: none;
  }
  audio {
    display: none;
  }
</style>
</head>
<body>

<!-- YouTube Embed (muted autoplay) -->

<audio id="bgm" autoplay loop preload="auto" muted>
  <source src="lemonglow.mp3" type="audio/mpeg">
</audio>

<div id="clickToEnable" style="
  position:fixed;inset:0;
  background:rgba(0,0,0,0); /* Fully transparent background */
  cursor:pointer;
  z-index:9999;
  /* Add text if you want to give a hint */
  /* color: white; text-align: center; font-size: 24px; pointer-events: none; */
">
    </div>

<script>
// Get the elements
document.addEventListener("DOMContentLoaded", () => {
  const iframe = document.getElementById("musicplayer");
  const audio = document.getElementById("bgm");
  const overlay = document.getElementById("clickToEnable");

  // Unmute local audio (Likely to be blocked ❌)
  audio.muted = false;
  
  audio.play().catch(error => {
    console.warn("Local audio playback failed on load, likely due to autoplay policy. User interaction is required.", error);
  });

  // Unmute YouTube player (Likely to be blocked ❌)
  const src = iframe.src;
  if (src.includes("mute=1")) {
    iframe.src = src.replace("mute=1", "mute=0");
  }

  // Remove overlay *immediately* on load
  // Removing this overlay removes the designated click target needed to start the audio.
  overlay.remove(); 
});
</script>

	

</body>
</html>
