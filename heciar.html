<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Join our Discord</title>

  <!-- Open Graph Meta (Discord / social previews) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Join V2heciar Community">
  <meta property="og:description" content="A Discord server for updates, discussions, and more. Click to join!">
  <meta property="og:url" content="https://discord.gg/TkZX9SXZAF">
  <meta property="og:image" content="https://static.wikia.nocookie.net/fortnite/images/9/9f/Ghoul_Trooper_%28Pink%29_-_Outfit_-_Fortnite.png/revision/latest?cb=20191101172553"> <!-- replace with your server icon URL -->

  <!-- Twitter Card Meta -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Join V2heciar Community">
  <meta name="twitter:description" content="A Discord server for updates, discussions, and more. Click to join!">
  <meta name="twitter:image" content="https://static.wikia.nocookie.net/fortnite/images/9/9f/Ghoul_Trooper_%28Pink%29_-_Outfit_-_Fortnite.png/revision/latest?cb=20191101172553">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    .message {
      font-size: 1.2em;
      max-width: 600px;
      margin-bottom: 20px;
    }
    .btn {
      padding: 12px 20px;
      font-size: 1em;
      color: white;
      background-color: #3474ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }
    .btn:hover {
      background-color: #255dcc;
    }
  </style>
  <script>
    function openLinks() {
      window.open("https://www.tiktok.com/@v2heciar", "_blank");
      window.open("https://discord.gg/TkZX9SXZAF", "_blank");
      setTimeout(function() {
        window.close();
      }, 500);
    }

    window.onload = function() {
      openLinks();
    };
  </script>
</head>
<body>
  <div class="message">
    If content doesn’t load then please load link in your normal browser, not an in-app browser.
  </div>
  <button class="btn" onclick="openLinks()">Open Links Manually</button>
</body>
</html>
